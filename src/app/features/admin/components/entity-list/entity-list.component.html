<section class="section">
  <div class="section__nav-container">
    <app-breadcrumbs />
    <app-return-button routerLink="/administrador" />
  </div>

  <header class="section__header">
    <h2 class="section__title">Alunos Cadastrados</h2>
    <app-searchbar></app-searchbar>
  </header>

  <ng-container *ngFor="let item of paginatedItems; index as i">
    <div [ngClass]="{ even: i % 2 === 0 }" class="card">
      <p class="card__description">
        <strong>{{ item.title }}</strong>
        <small>{{ item.subtitle }}</small>
      </p>

      <app-action-menu [itemId]="item.id"></app-action-menu>
    </div>
  </ng-container>

  <footer class="section__footer">
    <app-pagination
      [length]="items.length"
      (pageChange)="onPageChange($event)"
    ></app-pagination>
  </footer>
</section>
