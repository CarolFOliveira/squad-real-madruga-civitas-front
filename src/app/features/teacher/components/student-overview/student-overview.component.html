<section class="section">
  <header>
    <h2 class="section__title">{{ title }}</h2>
  </header>

  <dl class="list">
    <dt>Professor(a)</dt>
    <dd>{{ student.teacherName }}</dd>
    <dt>Data</dt>
    <dd>{{ student.idpRegisterDate }}</dd>
    <dt>Aluno(a)</dt>
    <dd>{{ student.studentName }}</dd>
    <dt>Número de matrícula do aluno</dt>
    <dd>{{ student.enrollmentNumber }}</dd>
    <dt>Ano/Turma</dt>
    <dd>{{ student.classroomName }}</dd>
  </dl>
</section>
